<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 590" role="img" aria-labelledby="title desc">
  <title id="title">法考错题复盘学习闭环</title>
  <desc id="desc">学习者提交错题后，系统进行结构化识别，经过知识点确认，再分别生成错题卡、图谱标注、复测任务和周期复盘，复测结果回写学习档案。</desc>
  <defs>
    <marker id="arrow-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#52657A"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#C5523D"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2E7D6B"/></marker>
    <style>
      .bg{fill:#F7F8FA}.rule{stroke:#D7DEE6;stroke-width:1}.lane{font:600 10px Arial,sans-serif;letter-spacing:1.4px;fill:#52657A}.step{font:600 11px Arial,sans-serif;fill:#183B56}.num{font:600 9px Arial,sans-serif;fill:#183B56}.node{fill:#fff;stroke:#9EACBA;stroke-width:1.2}.node-focus{fill:#FFF5EF;stroke:#C5523D;stroke-width:1.4}.node-done{fill:#F0F8F5;stroke:#2E7D6B;stroke-width:1.4}.tag{font:600 8px Arial,sans-serif;letter-spacing:.8px;fill:#52657A}.title{font:600 15px Arial,sans-serif;fill:#183B56}.sub{font:11px Arial,sans-serif;fill:#52657A}.tiny{font:10px Arial,sans-serif;fill:#52657A}.accent{fill:#C5523D}.green{fill:#2E7D6B}.edge{fill:none;stroke:#52657A;stroke-width:1.4;marker-end:url(#arrow-muted)}.edge-accent{fill:none;stroke:#C5523D;stroke-width:1.8;marker-end:url(#arrow-accent)}.edge-link{fill:none;stroke:#2E7D6B;stroke-width:1.6;marker-end:url(#arrow-link)}
    </style>
  </defs>
  <rect class="bg" width="1080" height="590"/>
  <text x="50" y="52" style="font:400 34px Georgia,serif;fill:#183B56">错题，不止记录一次</text>
  <text x="52" y="80" style="font:14px Arial,sans-serif;fill:#52657A">从原始错题到七日复测，形成可追踪的法考学习闭环</text>
  <line class="rule" x1="50" y1="104" x2="1030" y2="104"/>

  <text class="lane" x="52" y="145">学习者</text>
  <text class="lane" x="52" y="285">SKILL 工作流</text>
  <text class="lane" x="52" y="440">OBSIDIAN VAULT</text>
  <line class="rule" x1="170" y1="120" x2="170" y2="498"/>
  <line class="rule" x1="50" y1="240" x2="1030" y2="240"/>
  <line class="rule" x1="50" y1="400" x2="1030" y2="400"/>

  <g><rect x="220" y="126" width="150" height="74" rx="6" fill="#EDF2F6" stroke="#8EA0B0"/><text class="tag" x="237" y="149">输入</text><text class="title" x="237" y="174">题目 / 截图 / OCR</text><text class="sub" x="237" y="192">错题与疑问</text></g>
  <g><rect x="432" y="126" width="142" height="74" rx="6" fill="#EDF2F6" stroke="#8EA0B0"/><text class="tag" x="449" y="149">确认</text><text class="title" x="449" y="174">知识点与错因</text><text class="sub" x="449" y="192">人工确认后写入</text></g>
  <path class="edge" d="M370 163 H432"/>

  <g><rect class="node" x="220" y="270" width="150" height="90" rx="6"/><text class="tag" x="237" y="295">01 识别</text><text class="title" x="237" y="320">结构化错题</text><text class="sub" x="237" y="340">题干 · 选项 · 解析</text></g>
  <g><rect class="node-focus" x="432" y="270" width="142" height="90" rx="6"/><text class="tag accent" x="449" y="295">02 诊断</text><text class="title" x="449" y="320">错因诊断</text><text class="sub" x="449" y="340">不会 / 思路偏差</text></g>
  <g><rect class="node" x="637" y="270" width="142" height="90" rx="6"/><text class="tag" x="654" y="295">03 确认</text><text class="title" x="654" y="320">知识点确认</text><text class="sub" x="654" y="340">未确认不入库</text></g>
  <g><rect class="node-done" x="842" y="270" width="142" height="90" rx="6"/><text class="tag green" x="859" y="295">04 写入</text><text class="title" x="859" y="320">生成学习资产</text><text class="sub" x="859" y="340">卡片 · 队列 · 指标</text></g>
  <path class="edge" d="M370 315 H432"/><path class="edge-accent" d="M574 315 H637"/><path class="edge-link" d="M779 315 H842"/>
  <path class="edge" d="M503 200 V270"/>

  <g><rect class="node" x="202" y="430" width="146" height="78" rx="6"/><text class="tag" x="219" y="453">每日</text><text class="title" x="219" y="478">错题卡与索引</text><text class="sub" x="219" y="496">可检索的学习记录</text></g>
  <g><rect class="node" x="415" y="430" width="146" height="78" rx="6"/><text class="tag" x="432" y="453">图谱</text><text class="title" x="432" y="478">XMind 标注</text><text class="sub" x="432" y="496">红色薄弱 · 黄色易混</text></g>
  <g><rect class="node-focus" x="628" y="430" width="146" height="78" rx="6"/><text class="tag accent" x="645" y="453">复测</text><text class="title" x="645" y="478">七日复测队列</text><text class="sub" x="645" y="496">passed / failed / skipped</text></g>
  <g><rect class="node-done" x="841" y="430" width="146" height="78" rx="6"/><text class="tag green" x="858" y="453">复盘</text><text class="title" x="858" y="478">日 / 周复盘</text><text class="sub" x="858" y="496">数据面板与恢复追踪</text></g>
  <path class="edge-link" d="M913 360 V400 H275 V430"/><path class="edge-link" d="M913 360 V400 H488 V430"/><path class="edge-link" d="M913 360 V400 H701 V430"/><path class="edge-link" d="M913 360 V430"/>
  <path d="M701 508 V548 H503 V360" fill="none" stroke="#C5523D" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
  <rect x="520" y="530" width="160" height="20" rx="3" fill="#F7F8FA"/><text class="tiny" x="529" y="544">复测结果回写下一轮诊断</text>
</svg>
